name: Sync FAQs

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  sync-faqs:
    # Runs on your own machine (self-hosted runner) so it can reach your
    # local SQL Server. Requires the runner agent installed and running
    # on that machine (Settings → Actions → Runners in this repo).
    runs-on: self-hosted

    # The connection string is never hardcoded here — it's pulled from a
    # GitHub Actions secret configured in:
    # Repo → Settings → Secrets and variables → Actions → New repository secret
    # Name: MICRO1_DB_CONN_STR
    # Value: mssql+pyodbc://user:password@host/micro1?driver=ODBC+Driver+17+for+SQL+Server
    env:
      MICRO1_DB_CONN_STR: ${{ secrets.MICRO1_DB_CONN_STR }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No ODBC driver install step needed here — this runs on your own
      # Windows machine, which already has ODBC Driver 17 for SQL Server
      # installed (the same one you use when running the script manually).

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run FAQ sync
        run: python scrape_faqs.py python-developer-interview-questions